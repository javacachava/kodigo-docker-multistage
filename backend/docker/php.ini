; Ajustes de producción para PHP-FPM.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 128M
upload_max_filesize = 5M
post_max_size = 8M

opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 10000
; El código es inmutable dentro de la imagen: no hace falta revalidar archivos.
opcache.validate_timestamps = 0
